<!DOCTYPE html>
<html lang="vi">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F5H6TKDJ4J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F5H6TKDJ4J');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kèo Thơm - Tạo Link Shopee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS GỐC CỦA BẠN */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7b7a3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: white; padding: 35px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header i { color: #ee4d2d; font-size: 35px; margin-bottom: 10px; display: block; }
        .header h1 { color: #ee4d2d; font-size: 28px; font-weight: bold; margin: 0; }
        .sub-tag { display: inline-block; background-color: #fef0ed; color: #ee4d2d; padding: 5px 15px; border-radius: 20px; font-size: 14px; margin-top: 10px; font-weight: 600; }

        /* PHẦN NHẬP LIỆU CÓ NÚT X */
        .input-group { margin-bottom: 20px; position: relative; }
        .input-label { color: #333; font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; }
        .input-label i { margin-right: 8px; color: #555; }
        .input-wrapper { position: relative; }
        input { width: 100%; padding: 18px 45px 18px 18px; border: 1.5px solid #e0e0e0; border-radius: 12px; box-sizing: border-box; font-size: 16px; background-color: #fcfcfc; transition: 0.3s; }
        input:focus { border-color: #ee4d2d; outline: none; background-color: white; box-shadow: 0 0 0 3px rgba(238, 77, 45, 0.1); }
        .clear-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #ccc; cursor: pointer; font-size: 18px; display: none; }
        .clear-btn:hover { color: #ee4d2d; }

        .convert-btn { width: 100%; padding: 18px; background-color: #ee4d2d; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .convert-btn:hover { background-color: #d73211; }

        .result-box { margin-top: 25px; padding: 20px; background: #fff5f1; border-radius: 15px; border: 1px dashed #f5c6b9; display: none; }
        .result-label { color: #28a745; font-weight: bold; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; }
        .link-wrapper { background-color: white; padding: 15px; border-radius: 10px; border: 1px solid #e0e0e0; word-break: break-all; margin-bottom: 15px; font-size: 14px; }
        .link-wrapper a { color: #0056b3; text-decoration: none; font-weight: 500; }
        .link-wrapper a:hover { text-decoration: underline; }

        .btn-group-result { display: flex; flex-direction: column; gap: 10px; }
        .copy-btn { width: 100%; padding: 12px; background-color: white; color: #1877f2; border: 2px solid #1877f2; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .copy-btn:hover { background-color: #1877f2; color: white; }
        
        .go-shopee-btn { width: 100%; padding: 12px; background-color: #ee4d2d; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; text-decoration: none; text-align: center; display: flex; justify-content: center; align-items: center; gap: 8px; }

        /* CSS HƯỚNG DẪN VÀ FOOTER GIỮ NGUYÊN */
        .instructions-section { margin-top: 35px; border-top: 1px solid #eee; padding-top: 25px; }
        .section-title { color: #333; font-size: 20px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .steps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .step-item { background-color: #f9f9f9; padding: 20px; border-radius: 15px; border: 1px solid #eee; text-align: center; transition: 0.3s; }
        .step-icon { font-size: 30px; color: #ee4d2d; }
        .step-text { color: #555; font-size: 14px; margin-top: 10px; }
        .fb-redirect-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 25px; background-color: white; color: #0056b3; border: 2px solid #0056b3; border-radius: 30px; text-decoration: none; font-weight: bold; margin-top: 20px; }
        .footer-info { margin-top: 30px; background-color: #fffdec; padding: 20px; border-radius: 15px; border: 1px solid #ffeeba; }
        .social-links { margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; text-align: center; }
        .social-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; text-decoration: none; color: white; font-weight: 600; font-size: 13px; margin: 5px; }
        .btn-fb { background-color: #1877f2; }
        .btn-zalo { background-color: #0068ff; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="fas fa-magic"></i>
        <h1>Tạo Link Shopee</h1>
        <span class="sub-tag">Kèo Thơm Mỗi Ngày</span>
    </div>
    
    <div class="input-group">
        <label class="input-label"><i class="fas fa-link"></i> Dán link Shopee vào đây</label>
        <div class="input-wrapper">
            <input type="text" id="shopeeInput" placeholder="Ví dụ: https://shopee.vn/..." oninput="toggleClearBtn()">
            <i class="fas fa-times-circle clear-btn" id="clearBtn" onclick="clearInput()"></i>
        </div>
    </div>

    <button class="convert-btn" onclick="convertLink()">
        <i class="fas fa-pencil-alt"></i> Tạo Link Ngay
    </button>

    <div class="result-box" id="resultBox">
        <div class="result-label"><i class="fas fa-check-circle"></i> Thành công!</div>
        <div class="link-wrapper" id="affLinkWrapper">
            <a href="#" id="affLinkClickable" target="_blank"></a>
        </div>
        
        <div class="btn-group-result">
            <button class="copy-btn" onclick="copyLink()">
                <i class="far fa-copy"></i> SAO CHÉP LINK
            </button>
            <a href="#" id="shopeeDirectBtn" target="_blank" class="go-shopee-btn">
                <i class="fas fa-shopping-bag"></i> ĐẾN SHOPEE NGAY
            </a>
        </div>

        <div id="goFbWrapper" style="display:none; margin-top:15px; text-align:center;">
            <a href="https://www.facebook.com/share/p/17TctH8bAG/" target="_blank" class="fb-redirect-btn" style="font-size: 14px;">
                👉 Đi đến bài viết Facebook
            </a>
        </div>
    </div>

    <div class="instructions-section">
        <div class="section-title"><i class="fas fa-book-reader"></i> Hướng dẫn</div>
        <div class="steps-grid">
            <div class="step-item"><i class="fas fa-paste step-icon"></i><p class="step-text"><strong>Dán link</strong> sản phẩm Shopee.</p></div>
            <div class="step-item"><i class="fas fa-magic step-icon"></i><p class="step-text">Nhấn <strong>"Tạo Link"</strong> và <strong>"Sao chép"</strong>.</p></div>
            <div class="step-item"><i class="fab fa-facebook step-icon"></i><p class="step-text"><strong>Bình luận</strong> vào bài đăng Facebook.</p></div>
            <div class="step-item"><i class="fas fa-shopping-cart step-icon"></i><p class="step-text"><strong>Mở link</strong> để nhận mã giảm giá.</p></div>
        </div>
    </div>

    <div class="social-links">
        <a href="https://www.facebook.com/ChotKeoThomcungPM" target="_blank" class="social-btn btn-fb"><i class="fab fa-facebook-f"></i> Fanpage</a>
        <a href="https://zalo.me/g/vhorzb302" target="_blank" class="social-btn btn-zalo"><i class="fas fa-comments"></i> Group Zalo</a>
    </div>
</div>

<script>
    const MY_AFFILIATE_ID = "17365550406"; 
    const FIXED_SUB_ID = "test0"; 

    function toggleClearBtn() {
        const input = document.getElementById('shopeeInput');
        document.getElementById('clearBtn').style.display = input.value ? 'block' : 'none';
    }

    function clearInput() {
        const input = document.getElementById('shopeeInput');
        input.value = '';
        input.focus();
        toggleClearBtn();
    }

    async function convertLink() {
        const inputField = document.getElementById('shopeeInput');
        let input = inputField.value.trim();
        const resultBox = document.getElementById('resultBox');
        const affLinkA = document.getElementById('affLinkClickable');
        const shopeeDirectBtn = document.getElementById('shopeeDirectBtn');

        if (!input) { alert("Vui lòng dán link Shopee vào nhé!"); return; }

        try {
            affLinkA.innerText = "⏳ Đang xử lý...";
            resultBox.style.display = 'block';

            const res = await fetch("https://shopee-resolve.onrender.com/resolve", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: input })
            });

            const data = await res.json();
            if (!data.finalUrl) throw new Error();

            const encodedUrl = encodeURIComponent(data.finalUrl);
            const finalLink = `https://s.shopee.vn/an_redir?origin_link=${encodedUrl}&affiliate_id=${MY_AFFILIATE_ID}&sub_id=${FIXED_SUB_ID}`;

            // Hiển thị và gán link cho các nút
            affLinkA.innerText = finalLink;
            affLinkA.href = finalLink;
            shopeeDirectBtn.href = finalLink;

        } catch (err) {
            affLinkA.innerText = "❌ Không xử lý được link!";
        }
    }

    function copyLink() {
        const linkText = document.getElementById('affLinkClickable').innerText;
        if (!linkText || linkText.includes("⏳")) return;

        navigator.clipboard.writeText(linkText).then(() => {
            alert("✅ Đã sao chép link thành công!");
            document.getElementById('goFbWrapper').style.display = 'block';
        });
    }
</script>
</body>
</html>

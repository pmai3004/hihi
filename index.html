<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kèo Thơm - Tạo Link Shopee</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body { 
    font-family: system-ui;
    background-color: #f7b7a3; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
}

.container { 
    background: white; 
    padding: 35px; 
    border-radius: 24px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
    max-width: 600px; 
    width: 100%;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 15px;
}

.convert-btn {
    width: 100%;
    padding: 15px;
    background: #ee4d2d;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.result-box {
    margin-top: 20px;
    display: none;
}

.link-wrapper {
    background: #f1f1f1;
    padding: 10px;
    border-radius: 8px;
    margin: 10px 0;
    word-break: break-all;
}

.copy-btn {
    width: 100%;
    padding: 10px;
    border: 2px solid #1877f2;
    background: white;
    color: #1877f2;
    border-radius: 8px;
    cursor: pointer;
}

/* 🔥 TOAST */
#toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 15px 20px;
    border-radius: 10px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 9999;
    opacity: 0;
    transition: 0.3s;
}

.toast-link {
    color: #4da6ff;
    font-weight: bold;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">
    <h2 style="text-align:center;color:#ee4d2d">Tạo Link Shopee</h2>

    <input type="text" id="shopeeInput" placeholder="Dán link Shopee...">

    <button class="convert-btn" onclick="convertLink()">Tạo Link</button>

    <div class="result-box" id="resultBox">
        <div id="affLink" class="link-wrapper"></div>
        <button class="copy-btn" onclick="copyLink()">SAO CHÉP LINK</button>
    </div>
</div>

<!-- 🔥 TOAST -->
<div id="toast">
    <span>✅ Đã sao chép!</span>
    <a href="https://www.facebook.com/share/p/17TctH8bAG/" target="_blank" class="toast-link">
        Đi đến Facebook
    </a>
</div>

<script>
fetch("https://shopee-resolve.onrender.com/ping");

const MY_AFFILIATE_ID = "17365550406"; 
const FIXED_SUB_ID = "test0"; 

async function convertLink() {
    let input = document.getElementById('shopeeInput').value.trim();
    const resultBox = document.getElementById('resultBox');
    const affLinkDiv = document.getElementById('affLink');

    if (!input) {
        alert("Dán link Shopee vào!");
        return;
    }

    try {
        affLinkDiv.innerText = "⏳ Đang xử lý...";
        resultBox.style.display = 'block';

        const res = await fetch("https://shopee-resolve.onrender.com/resolve", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ url: input })
        });

        const data = await res.json();
        if (!data.finalUrl) throw new Error();

        const encodedUrl = encodeURIComponent(data.finalUrl);

        const finalLink = `https://s.shopee.vn/an_redir?origin_link=${encodedUrl}&affiliate_id=${MY_AFFILIATE_ID}&sub_id=${FIXED_SUB_ID}`;

        affLinkDiv.innerText = finalLink;

    } catch {
        affLinkDiv.innerText = "❌ Lỗi xử lý link!";
    }
}

function copyLink() {
    const linkText = document.getElementById('affLink').innerText;
    if (!linkText) return;

    navigator.clipboard.writeText(linkText)
    .then(() => {
        showToast();
    })
    .catch(() => {
        alert("Không copy được!");
    });
}

function showToast() {
    const toast = document.getElementById("toast");

    toast.style.display = "flex";
    setTimeout(() => toast.style.opacity = "1", 10);

    setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.style.display = "none", 300);
    }, 5000);
}
</script>

</body>
</html>

<div class="step-item">
                <div class="step-icon-wrapper">
                    <i class="fab fa-facebook step-icon"></i>
                    <span class="step-number">3</span>
                </div>
                <p class="step-text"><strong>Bình luận</strong> đường link bạn vừa copy vào <a href="https://www.facebook.com/ChotKeoThomcungPM" target="_blank" style="color: #0056b3; text-decoration: underline; font-weight: bold;">bài đăng</a> ở nút bên dưới.</p>
            </div>

<script>
    // ID AFFILIATE CỦA PM
    const MY_AFFILIATE_ID = "17365550406"; 
    // CỐ ĐỊNH SUB ID LÀ AFb
    const SUB_ID = "AFb";

    function convertLink() {
        const input = document.getElementById('shopeeInput').value.trim();
        if (!input) {
            alert("Vui lòng dán link sản phẩm Shopee trước nhé!");
            return;
        }

        // Bước 1: Mã hóa link gốc (URL Encoding)
        const encodedUrl = encodeURIComponent(input);

        // Bước 2: Ghép theo công thức chuẩn + Gắn thêm Sub ID cố định AFb
        const finalLink = `https://s.shopee.vn/an_redir?origin_link=${encodedUrl}&affiliate_id=${MY_AFFILIATE_ID}&sub_id=${SUB_ID}`;

        // Bước 3: Hiển thị kết quả
        document.getElementById('affLink').innerText = finalLink;
        document.getElementById('resultBox').style.display = 'block';
        
        // Cuộn xuống để người dùng thấy kết quả ngay
        document.getElementById('resultBox').scrollIntoView({behavior: 'smooth'});
    }

    function copyLink() {
        const linkText = document.getElementById('affLink').innerText;
        if (!linkText) return;
        
        navigator.clipboard.writeText(linkText).then(() => {
            alert("Đã sao chép link thành công! Giờ hãy đi bình luận để săn mã nhé.");
        }).catch(err => {
            alert("Lỗi khi sao chép link. Bạn vui lòng tự bôi đen và copy nhé.");
        });
    }
</script>

<!DOCTYPE html>
<html lang="vi">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F5H6TKDJ4J"></script>
<script>

  function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kèo Thơm - Tạo Link Shopee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* GIỮ NGUYÊN GIAO DIỆN GỐC */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f7b7a3; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        
        .container { 
            background: white; 
            padding: 35px; 
            border-radius: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 600px; 
            box-sizing: border-box; /* Đảm bảo padding không làm tràn container */
        }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header i { color: #ee4d2d; font-size: 35px; margin-bottom: 10px; display: block; }
        .header h1 { color: #ee4d2d; font-size: 28px; font-weight: bold; margin: 0; }
        .sub-tag { display: inline-block; background-color: #fef0ed; color: #ee4d2d; padding: 5px 15px; border-radius: 20px; font-size: 14px; margin-top: 10px; font-weight: 600; }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-label { color: #333; font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; }
        .input-label i { margin-right: 8px; color: #555; }

        input { 
            width: 100%; 
            padding: 18px; 
            padding-right: 45px;
            border: 1.5px solid #e0e0e0; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #fcfcfc;
            transition: 0.3s;
        }
        input:focus { border-color: #ee4d2d; outline: none; background-color: white; box-shadow: 0 0 0 3px rgba(238, 77, 45, 0.1); }

        .clear-btn { position: absolute; right: 15px; top: 52px; color: #ccc; cursor: pointer; display: none; font-size: 20px; }

        .convert-btn { 
            width: 100%; padding: 18px; background-color: #ee4d2d; color: white; border: none; border-radius: 12px; 
            font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .result-box { margin-top: 25px; padding: 20px; background: #fff5f1; border-radius: 15px; border: 1px dashed #f5c6b9; display: none; }
        .result-label { color: #28a745; font-weight: bold; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; }
        .link-wrapper { background-color: white; padding: 15px; border-radius: 10px; border: 1px solid #e0e0e0; word-break: break-all; margin-bottom: 15px; font-size: 14px; }
        .link-wrapper a { color: #0056b3; text-decoration: none; font-weight: 500; }

        /* ĐỒNG BỘ KÍCH THƯỚC 2 NÚT */
        .copy-btn, .go-shopee-btn { 
            width: 100%; 
            height: 50px; /* Cố định chiều cao để bằng nhau tuyệt đối */
            box-sizing: border-box; 
            margin-bottom: 10px;
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .copy-btn { background-color: white; color: #1877f2; border: 2px solid #1877f2; }
        .copy-btn:hover { background-color: #1877f2; color: white; }

        .go-shopee-btn { background-color: #ee4d2d; color: white; border: none; }
        .go-shopee-btn:hover { background-color: #d73211; }

        /* CÁC PHẦN CÒN LẠI GIỮ NGUYÊN */
        .instructions-section { margin-top: 35px; border-top: 1px solid #eee; padding-top: 25px; }
        .steps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .step-item { background-color: #f9f9f9; padding: 20px; border-radius: 15px; border: 1px solid #eee; text-align: center; }
        .fb-redirect-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 25px; background-color: white; color: #0056b3; border: 2px solid #0056b3; border-radius: 30px; text-decoration: none; font-weight: bold; }
        .footer-info { margin-top: 30px; background-color: #fffdec; padding: 20px; border-radius: 15px; border: 1px solid #ffeeba; }
        .social-links { margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; text-align: center; }
        .social-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; text-decoration: none; color: white; font-weight: 600; font-size: 14px; margin: 5px; }
        .btn-group { background-color: #4267B2; } .btn-fb { background-color: #1877f2; } .btn-zalo { background-color: #0068ff; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="fas fa-magic"></i>
        <h1>Tạo Link Shopee</h1>
        <span class="sub-tag">Kèo Thơm Mỗi Ngày</span>
    </div>
    
    <div class="input-group">
        <label class="input-label"><i class="fas fa-link"></i> Dán link sản phẩm Shopee vào đây</label>
        <input type="text" id="shopeeInput" placeholder="Ví dụ: https://shopee.vn/..." oninput="toggleClearBtn()">
        <i class="fas fa-times-circle clear-btn" id="clearBtn" onclick="clearInput()"></i>
    </div>

    <button class="convert-btn" onclick="convertLink()">
        <i class="fas fa-pencil-alt"></i> Tạo Link Ngay
    </button>

    <div class="result-box" id="resultBox">
        <div class="result-label"><i class="fas fa-check-circle"></i> Thành công!</div>
        <div class="link-wrapper" id="affLink"></div>
        
        <button class="copy-btn" onclick="copyLink()">
            <i class="far fa-copy"></i> SAO CHÉP LINK
        </button>

        <a href="#" id="goShopeeBtn" target="_blank" class="go-shopee-btn" style="display: none;">
            <i class="fas fa-shopping-bag"></i> ĐẾN SHOPEE NGAY
        </a>

        <div id="goFbWrapper" style="display:none; margin-top:10px; text-align: center;">
            <a href="https://www.facebook.com/share/p/17TctH8bAG/" target="_blank" class="fb-redirect-btn">👉 Đi đến bài viết Facebook</a>
        </div>
    </div>

    <div class="instructions-section">
        <div class="steps-grid">
            <div class="step-item"><p class="step-text">1. Dán link</p></div>
            <div class="step-item"><p class="step-text">2. Tạo & Sao chép</p></div>
            <div class="step-item"><p class="step-text">3. Bình luận FB</p></div>
            <div class="step-item"><p class="step-text">4. Click mua hàng</p></div>
        </div>
    </div>

    <div class="social-links">
        <a href="https://www.facebook.com/groups/958595413179217" target="_blank" class="social-btn btn-group">Group FB</a>
        <a href="https://www.facebook.com/ChotKeoThomcungPM" target="_blank" class="social-btn btn-fb">Fanpage</a>
        <a href="https://zalo.me/g/vhorzb302" target="_blank" class="social-btn btn-zalo">Zalo</a>
    </div>
</div>

<script>
    const MY_AFFILIATE_ID = "17365550406"; 
    const FIXED_SUB_ID = "test0"; 

    function toggleClearBtn() {
        const input = document.getElementById('shopeeInput');
        document.getElementById('clearBtn').style.display = input.value.length > 0 ? 'block' : 'none';
    }

    function clearInput() {
        const input = document.getElementById('shopeeInput');
        input.value = ''; toggleClearBtn(); input.focus();
    }

    async function convertLink() {
        const input = document.getElementById('shopeeInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        const affLinkDiv = document.getElementById('affLink');
        const goShopeeBtn = document.getElementById('goShopeeBtn');

        if (!input) { alert("Vui lòng dán link Shopee vào nhé!"); return; }

        affLinkDiv.innerText = "⏳ Đang xử lý...";
        resultBox.style.display = 'block';

        try {
            const res = await fetch("https://shopee-resolve.onrender.com/resolve", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: input })
            });
            const data = await res.json();
            const finalLink = `https://s.shopee.vn/an_redir?origin_link=${encodeURIComponent(data.finalUrl)}&affiliate_id=${MY_AFFILIATE_ID}&sub_id=${FIXED_SUB_ID}`;

            affLinkDiv.innerHTML = `<a href="${finalLink}" target="_blank">${finalLink}</a>`;
            goShopeeBtn.href = finalLink;
            goShopeeBtn.style.display = 'flex';
        } catch {
            affLinkDiv.innerText = "❌ Lỗi xử lý!";
        }
    }

    function copyLink() {
        const text = document.getElementById('affLink').innerText;
        if (!text || text.includes("⏳")) return;
        navigator.clipboard.writeText(text).then(() => {
            document.getElementById('goFbWrapper').style.display = 'block';
        });
    }
</script>
</body>
</html>
